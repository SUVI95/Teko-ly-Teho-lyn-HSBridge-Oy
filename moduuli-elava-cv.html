<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elävä CV — Valitse tyyli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14131a;--paper:#f7f5f1;--muted:#6b6570;--border:rgba(20,19,26,.1);
  --card:#fff;--shadow:0 12px 40px rgba(20,19,26,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',system-ui,sans-serif;background:
  radial-gradient(ellipse 80% 50% at 10% -10%,rgba(166,124,82,.18),transparent 55%),
  radial-gradient(ellipse 70% 45% at 100% 0%,rgba(255,1,79,.1),transparent 50%),
  var(--paper);color:var(--ink);min-height:100vh;}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;position:sticky;top:0;z-index:10;background:rgba(247,245,241,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.top a{color:var(--muted);text-decoration:none;font-size:.84rem;display:inline-flex;align-items:center;gap:.35rem;}
.top a:hover{color:var(--ink);}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8B6914;background:rgba(166,124,82,.12);padding:.3rem .65rem;border-radius:999px;}
.wrap{max-width:1040px;margin:0 auto;padding:2rem 1.15rem 4rem;}
.hero-kicker{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8B6914;margin-bottom:.75rem;}
h1{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(1.85rem,5vw,3rem);line-height:1.15;font-weight:400;margin-bottom:.75rem;}
h1 em{font-style:italic;}
.lead{font-size:1.02rem;color:var(--muted);line-height:1.65;max-width:36rem;margin-bottom:1.75rem;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;}
.card{display:flex;flex-direction:column;text-align:left;border:1.5px solid var(--border);border-radius:18px;background:var(--card);overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;font:inherit;color:inherit;padding:0;width:100%;min-width:0;box-shadow:0 2px 10px rgba(20,19,26,.03);}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent;outline:none;}
.card:focus-visible{box-shadow:var(--shadow),0 0 0 3px rgba(166,124,82,.35);}
.thumb{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#e8e4dc;border-bottom:1px solid var(--border);}
.thumb-inner{position:absolute;top:0;left:0;width:1280px;height:900px;transform-origin:top left;pointer-events:none;}
.thumb-inner iframe{width:1280px;height:900px;border:0;display:block;background:#fff;}
.thumb-fade{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(to top,rgba(20,19,26,.18),transparent);pointer-events:none;}
.name-chip{position:absolute;left:.7rem;bottom:.7rem;z-index:2;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);color:var(--ink);font-size:.78rem;font-weight:700;padding:.35rem .65rem;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.1);letter-spacing:.01em;}
.thumb-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--muted);background:linear-gradient(135deg,#f3efe8,#e7e1d6);}
.body{padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;gap:.35rem;flex:1;min-width:0;}
.body h2{font-size:1.08rem;font-weight:700;}
.body p{font-size:.84rem;color:var(--muted);line-height:1.5;}
.cta{display:inline-flex;align-items:center;gap:.35rem;margin-top:.25rem;font-size:.82rem;font-weight:700;color:var(--ink);}
.card:hover .cta{gap:.55rem;}
.note{margin-top:1.75rem;padding:1rem 1.15rem;border-radius:14px;background:rgba(255,255,255,.65);border:1px solid var(--border);font-size:.84rem;color:var(--muted);line-height:1.55;}
@media(max-width:720px){
  .grid{grid-template-columns:1fr;gap:.9rem;}
  .wrap{padding:1.35rem 1rem 3.5rem;}
  .thumb{aspect-ratio:16/11;}
  .body{padding:.95rem 1rem 1.05rem;}
}
@media(min-width:1100px){
  .thumb{aspect-ratio:16/9.5;}
}
</style>
</head>
<body>
<header class="top">
  <a href="/">← Etusivu</a>
  <span class="badge">Elävä CV</span>
</header>

<main class="wrap">
  <p class="hero-kicker">Vaihe 0 · tyyli</p>
  <h1>Valitse portfolion <em>tyyli</em></h1>
  <p class="lead">Katso esikatselusta fiilis, valitse yksi tyyli ja jatka täyttöön. Voit vaihtaa tyyliä myöhemmin.</p>

  <div class="grid" id="styleGrid" role="list"></div>

  <p class="note">Kortissa näkyy demosisällön portfolio-esikatselu. «Vaihda tyyliä» editorissa tuo sinut takaisin tähän.</p>
</main>

<script src="/js/portfolio-public-features.js"></script>
<script src="/js/portfolio-design-mock-data.js"></script>
<script src="/portfolio-veyssette-preview.js"></script>
<script src="/portfolio-nord-preview.js"></script>
<script src="/portfolio-reeni-preview.js"></script>
<script src="/portfolio-callum-preview.js"></script>
<script src="/portfolio-femia-preview.js"></script>
<script>
(function () {
  var qs = window.location.search || '';
  var DESIGNS = [
    {
      id: 'veyssette',
      name: 'Veyssette',
      blurb: 'Cream & gold — lämmin editorial-luksus, vahva hero.',
      href: '/module/moduuli-elava-cv-veyssette',
      render: 'renderVeyssettePreview'
    },
    {
      id: 'nord',
      name: 'Nord',
      blurb: 'Sama layout kuin Veyssette — navy & valkoinen, selkeän maskuliinen.',
      href: '/module/moduuli-elava-cv-nord',
      render: 'renderNordPreview'
    },
    {
      id: 'callum',
      name: 'Callum',
      blurb: 'Tumma hero, keltainen aksentti — rohkea toinen maskuliinen vaihtoehto.',
      href: '/module/moduuli-elava-cv-callum',
      render: 'renderCallumPreview'
    },
    {
      id: 'reeni',
      name: 'Reeni',
      blurb: 'Valkoinen moderni layout, pinkki–oranssi gradientti ja selkeät kortit.',
      href: '/module/moduuli-elava-cv-reeni',
      render: 'renderReeniPreview'
    },
    {
      id: 'femia',
      name: 'Femia',
      blurb: 'Pehmeä blush-tyyli, Plus Jakarta — lämmin ja lähestyttävä.',
      href: '/module/moduuli-elava-cv-femia',
      render: 'renderFemiaPreview'
    }
  ];

  function withQs(href) {
    if (!qs || qs === '?') return href;
    return href + (href.indexOf('?') >= 0 ? '&' : '?') + qs.replace(/^\?/, '');
  }

  function fitThumb(thumb) {
    var inner = thumb.querySelector('.thumb-inner');
    if (!inner) return;
    var w = thumb.clientWidth || 1;
    var s = w / 1280;
    inner.style.transform = 'scale(' + s + ')';
  }

  var grid = document.getElementById('styleGrid');
  var thumbs = [];

  DESIGNS.forEach(function (d) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.setAttribute('data-id', d.id);
    btn.setAttribute('role', 'listitem');
    btn.setAttribute('aria-label', d.name + ' — aloita tällä tyylillä');
    btn.innerHTML =
      '<div class="thumb" aria-hidden="true">' +
        '<div class="thumb-loading">Ladataan esikatselua…</div>' +
        '<div class="thumb-inner" hidden><iframe title="' + d.name + ' esikatselu" loading="lazy" tabindex="-1"></iframe></div>' +
        '<div class="thumb-fade"></div>' +
        '<span class="name-chip">' + d.name + '</span>' +
      '</div>' +
      '<div class="body">' +
        '<h2>' + d.name + '</h2>' +
        '<p>' + d.blurb + '</p>' +
        '<span class="cta">Aloita tällä tyylillä →</span>' +
      '</div>';

    btn.addEventListener('click', function () {
      try { localStorage.setItem('ecv_selected_style', d.id); } catch (e) {}
      window.location.href = withQs(d.href);
    });

    grid.appendChild(btn);

    var thumb = btn.querySelector('.thumb');
    var inner = btn.querySelector('.thumb-inner');
    var iframe = btn.querySelector('iframe');
    var loading = btn.querySelector('.thumb-loading');
    thumbs.push(thumb);

    requestAnimationFrame(function () {
      try {
        var fn = window[d.render];
        var demo = typeof clonePortfolioDemo === 'function' ? clonePortfolioDemo(d.id) : {};
        if (typeof fn !== 'function') throw new Error('preview missing');
        iframe.srcdoc = fn(demo);
        inner.hidden = false;
        if (loading) loading.remove();
        fitThumb(thumb);
        iframe.addEventListener('load', function () { fitThumb(thumb); });
      } catch (e) {
        if (loading) loading.textContent = d.name;
      }
    });
  });

  function refitAll() { thumbs.forEach(fitThumb); }
  window.addEventListener('resize', refitAll);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(refitAll);
    thumbs.forEach(function (t) { ro.observe(t); });
  }
  window.addEventListener('orientationchange', function () { setTimeout(refitAll, 120); });
})();
</script>
</body>
</html>
